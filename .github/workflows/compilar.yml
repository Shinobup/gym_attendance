name: Compilar APK Kratos

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Traer tu codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar Java (Necesario para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flet en el servidor
        run: pip install flet

      - name: Construir infraestructura de soporte
    env:
      LLAVE_SECRETA: ${{ secrets.GOOGLE_CREDENTIALS }}
    run: |
      mkdir assets
      python -c "import os; open('assets/credenciales.json', 'w').write(os.environ['LLAVE_SECRETA'])"
      mkdir wsgiref
      touch wsgiref/__init__.py
      cat << 'EOF' > wsgiref/simple_server.py
      class WSGIServer: pass
      class WSGIRequestHandler: pass
      def make_server(*args, **kwargs): pass
      EOF
      cat << 'EOF' > wsgiref/util.py
      def get_environ(*args, **kwargs): pass
      EOF

      - name: Construir la APK
        run: yes | flet build apk

      - name: Subir la APK lista para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Gym-Kratos-APK
          path: build/apk/**/*.apk